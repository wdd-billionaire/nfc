name: nfc_tool
description: "Open BLE client for a ChameleonUltra/Proxmark3-class NFC device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned to versions whose Android modules hardcode compileSdk (do not rely on
  # Flutter injecting flutter.compileSdkVersion into plugin projects, which the
  # pinned Flutter 3.24.x toolchain does not do).
  flutter_blue_plus: 1.32.12
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
